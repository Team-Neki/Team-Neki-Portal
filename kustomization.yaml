apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/ingressroute-https.yaml
  - k8s/certificate.yaml

# 루트의 index.html 을 portal-html ConfigMap 으로 생성.
# 내용이 바뀌면 이름에 해시가 붙어 파드가 자동 롤링됨.
configMapGenerator:
  - name: portal-html
    files:
      - index.html
