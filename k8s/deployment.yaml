apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: prod
  labels:
    app: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              # stock nginx는 master가 root로 실행됨 → ALL 드롭 시 아래 최소 권한이 없으면 기동 실패
              add:
                - NET_BIND_SERVICE  # 포트 80(<1024) 바인딩
                - SETUID            # worker 프로세스를 nginx 유저로 강등
                - SETGID
                - CHOWN             # 캐시/로그 디렉토리 소유권 변경
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: html
          configMap:
            name: portal-html
